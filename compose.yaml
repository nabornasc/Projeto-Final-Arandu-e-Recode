services:
  mysql:
    image: mysql:8.4
    container_name: arandue-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: arandue
      MYSQL_USER: arandue
      MYSQL_PASSWORD: arandue
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: arandue-backend
    build:
      context: ./backend
    container_name: arandue-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: arandue
      DB_USER: arandue
      DB_PASSWORD: arandue
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
