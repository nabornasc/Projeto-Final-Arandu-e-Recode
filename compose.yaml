services:
  postgres:
    image: postgres:17-alpine
    container_name: arandue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: arandue
      POSTGRES_USER: arandue
      POSTGRES_PASSWORD: arandue
    ports:
      # Só aceita conexões da própria máquina.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arandue -d arandue"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
